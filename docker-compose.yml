name: ecommerce_cds

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT}:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - ecommerce_cds

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped

    command: >
      mini
      -dir=/data
      -master.volumeSizeLimitMB=1024

    ports:
      - "${SEAWEED_S3_PORT}:8333"
      - "${SEAWEED_FILER_PORT}:8888"
      - "${SEAWEED_MASTER_PORT}:9333"

    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}

    volumes:
      - seaweedfs_data:/data

    networks:
      - ecommerce_cds

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5

networks:
  ecommerce_cds:
    driver: bridge

volumes:
  postgres_data:
  seaweedfs_data:

